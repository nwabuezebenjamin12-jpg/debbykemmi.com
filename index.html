<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebbKemmi - Shop Like Never Before</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1>DebbKemmi</h1>
                <p class="tagline">Shop Like Never Before</p>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for products..." />
                <button onclick="searchProducts()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
            <div class="cart-icon" onclick="toggleCart()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="container">
            <button class="nav-item active" onclick="filterByCategory('all', event)">All Products</button>
            <button class="nav-item" onclick="filterByCategory('electronics', event)">Electronics</button>
            <button class="nav-item" onclick="filterByCategory('fashion', event)">Fashion</button>
            <button class="nav-item" onclick="filterByCategory('home', event)">Home & Garden</button>
            <button class="nav-item" onclick="filterByCategory('beauty', event)">Beauty</button>
            <button class="nav-item" onclick="filterByCategory('sports', event)">Sports</button>
        </div>
    </nav>

    <!-- Banner -->
    <section class="banner">
        <div class="container">
            <h2>Amazing Deals Every Day!</h2>
            <p>Shop millions of products at unbeatable prices</p>
        </div>
    </section>

    <!-- Products Grid -->
    <main class="main-content">
        <div class="container">
            <div id="productsGrid" class="products-grid"></div>
        </div>
    </main>

    <!-- Shopping Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-btn" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
